name: Create repository snapshot

on:
  push:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Create snapshot
        run: git archive --format=zip --output=repo-snapshot.zip HEAD^
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nishanttyagi-github-repo-snapshot
          path: repo-snapshot.zip
